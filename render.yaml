services:
  - type: web
    name: swarm-ide
    runtime: node
    plan: starter
    buildCommand: if [ -f package-lock.json ]; then npm ci; else npm install --legacy-peer-deps; fi && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
